<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather app with javascript</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="search-box">
                <input type="text" placeholder="Enter your location"
                class ="input-box">
                <button id="searchBtn"><i class="fas fa-search"></i> 
                </button> 
            </div>
        
        </div>
        <div class="location-not-found">
            <h1>Sorry, location not found!!!</h1>
            <img src="file:///F:/weather%20app/assets/404.png"alt="404 error">
        </div>
        
        <div class="Weather-body"></div>
        <img src="file:///F:/weather%20app/assets/Cloud.png.png" width="200" height="200" alt="Weather Image" class="weather-img">

        <div class="weather-box">
        <p class="temperature">0<sup>°C</sup></p>
        <p class="description">light rain</p>
        </div>        
        <div class="weather-details">
            <div class="humidity">
                <i class="fas fa-tint"></i>
                <div class="text">
                    <span id="humidity">45%</span>
                    <p>Humidity</p>
                </div>
            </div>
        
        
            <div class="wind">
                <i class="fa-solid fa-wind"></i>
                <div class="text">
                    <span id="wind-speed">12km/H</span>
                    <p>wind-speed</p>
                    </div>
                </div>
            </div>
    </div>
    

 <script src="script.js"></script>   
 <script src="https://kit.fontawesome.com/b5674b25d6.js" crossorigin="anonymous"></script>
</body>
</html>
